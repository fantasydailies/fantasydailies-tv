# Tallkk puller: brings queued shows' YouTube episodes onto the Tallkk TV channels (only shows whose hosts gave written OK).
# Runs every 4 hours, or on demand from the Actions tab. No secret to set: it signs in to tallkk.com with GitHub's own signed
# token, and tallkk.com only lets this workflow on main in.
name: Tallkk puller
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["puller-run.txt"]
permissions:
  id-token: write
  contents: read
concurrency:
  group: tallkk-puller
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install -q -U yt-dlp requests && ffmpeg -version | head -1
      - name: Sign in to Tallkk
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=tallkk" | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])")
          R=$(curl -sS -X POST -H "Authorization: Bearer $T" --data-urlencode "t=$T" "https://tallkk.com/tkcontrol.php?api=ghkey")
          K=$(printf '%s' "$R" | python3 -c "import json,sys;j=json.load(sys.stdin);print(j.get('key',''))" 2>/dev/null || true)
          if [ -z "$K" ]; then echo "Tallkk refused the puller: $R"; exit 1; fi
          echo "::add-mask::$K"; echo "TALLKK_TOOL_KEY=$K" >> "$GITHUB_ENV"; echo "signed in"
      - name: Get the puller
        run: curl -fsSL https://tallkk.com/tallkk-puller.py -o puller.py
      - name: Bring episodes over
        run: python puller.py --max 5
