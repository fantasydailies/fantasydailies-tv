name: FantasyDailies TV build v7
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
      LOG: ${{ github.workspace }}/log.txt
    steps:
      - id: code
        name: Get the app code from FantasyDailies.com
        run: |
          for i in 1 2 3; do
            CODE=$(curl -sS -A "$UA" -L -o src.zip -w "%{http_code}" "https://fantasydailies.com/fdtvsrc.php?k=750771025dedf42c3139c0f91cd38822" || echo "000")
            echo "try $i - the server answered: $CODE" | tee -a "$LOG"
            if [ "$CODE" = "200" ] && [ "$(head -c 2 src.zip)" = "PK" ]; then break; fi
            sleep 5
          done
          if [ "$(head -c 2 src.zip)" != "PK" ]; then echo "THE SERVER DID NOT HAND OVER THE CODE:" | tee -a "$LOG"; head -c 600 src.zip | tee -a "$LOG"; exit 1; fi
          unzip -q src.zip -d src && echo "got the app code" | tee -a "$LOG"
      - id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - id: android
        name: Android tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > src/local.properties
          echo "Android tools ready" | tee -a "$LOG"
      - id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - id: build
        name: Build the Fire TV app and the Google Play file
        working-directory: src
        run: |
          set -o pipefail
          export FDTV_KS_PASS="$(cat kspass.txt)"
          gradle assembleRelease bundleRelease --no-daemon 2>&1 | tee -a "$LOG"
      - id: send
        name: Send both files to FantasyDailies.com
        working-directory: src
        run: |
          curl -sS -A "$UA" -F "k=750771025dedf42c3139c0f91cd38822" -F "apk=@app/build/outputs/apk/release/app-release.apk" https://fantasydailies.com/fdtvdrop.php 2>&1 | tee a1.txt | tee -a "$LOG"
          curl -sS -A "$UA" -F "k=750771025dedf42c3139c0f91cd38822" -F "aab=@app/build/outputs/bundle/release/app-release.aab" https://fantasydailies.com/fdtvdrop.php 2>&1 | tee a2.txt | tee -a "$LOG"
          grep -q "received" a1.txt || { echo "THE SERVER DID NOT TAKE THE FIRE TV APP" | tee -a "$LOG"; exit 1; }
          grep -q "received bundle" a2.txt || { echo "THE SERVER DID NOT TAKE THE GOOGLE PLAY FILE" | tee -a "$LOG"; exit 1; }
      - name: Report to FantasyDailies.com
        if: always()
        run: |
          {
          echo "BUILD v7 FINISHED - $(date -u '+%b %d %H:%M') UTC - run ${{ github.run_number }} - overall: ${{ job.status }}"
          echo
          echo "get the code: ${{ steps.code.outcome }}"
          echo "set up Java: ${{ steps.java.outcome }}"
          echo "Android tools: ${{ steps.android.outcome }}"
          echo "set up Gradle: ${{ steps.gradle.outcome }}"
          echo "build both files: ${{ steps.build.outcome }}"
          echo "send both files: ${{ steps.send.outcome }}"
          echo
          echo "== what went wrong (if anything) =="
          grep -n -A12 -i "what went wrong\|error:\|THE SERVER DID NOT" "$LOG" 2>/dev/null | head -n 80
          echo
          echo "== last lines =="
          tail -n 40 "$LOG" 2>/dev/null
          } > report.txt
          curl -sS -A "$UA" --data-urlencode "k=750771025dedf42c3139c0f91cd38822" --data-urlencode "report@report.txt" https://fantasydailies.com/fdtvdrop.php || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fantasydailies-tv-files
          path: |
            src/app/build/outputs/apk/release/app-release.apk
            src/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
